# Inference test config — Qwen2.5-0.5B, TP=1, PP=1, random weights
# Usage: torchrun --nproc_per_node=1 test_generate.py scripts/test_generate.yaml

paths:
  tokenizer_model: /home/pkuhetu/lxy/checkpoints/Qwen2.5-0.5B
  model_config_path: null

runtime:
  parallel:
    pp_deg: 1
    global_tp_deg: 1
    global_tp_consec: 1
    global_cp_deg: 1
    global_ep_deg: 1
    global_tp_of_ep_deg: 1
    global_checkpoint: 0
    sdp: 0
    default_dp_type: ddp
    pipeline_type: gpipe
    galvatron_config_path: null
    vocab_sdp: 0
    vocab_tp: 1
    vocab_cp: 1
    async_grad_reduce: true
    mixed_precision: bf16
    use_ulysses: false
    reduce_in_fp32: false
    entropy_in_fp32: false
    vocab_sp: false

  model:
    is_moe_model: false
    set_experts_manually: 0
    set_model_config_manually: 0
    set_layernum_manually: 0
    set_seqlen_manually: 1
    initialize_on_meta: 0
    shape_order: SBH
    dropout_prob: 0.0
    print_loss: 0
    hf_model_name_or_path: /home/pkuhetu/lxy/checkpoints/Qwen2.5-0.5B
    model_size: qwen2.5-0.5b
    model_config_path: null

  profile:
    profile: 0
    profile_mode: static
    profile_unit: all
    profile_forward: 0
    save_profiled_memory: 0
    exit_after_profiling: 0

  train:
    train_iters: 0
    eval_iters: 0
    lr: 1.0e-5
    min_lr: 1.0e-6
    lr_decay_style: cosine
    lr_warmup_fraction: 0.1
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    init_method_std: 0.02
    sequence_parallel: false
    use_flash_attn: true
    global_batch_size: 1
    micro_batch_size: 1
    chunks: 1
    seq_length: 128
    clip_grad: 1.0

  data:
    data_path: null
    split: "949,50,1"
    tokenizer_type: HuggingFaceTokenizer
    tokenizer_model: ${paths.tokenizer_model}
    shared_storage: true

  ckpt:
    load: null
    load_iteration: 0
    distributed_checkpoint: false
    save: null
    save_interval: null
